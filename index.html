<h1 id="title">Privacy policy</h1>
<p class="eff" id="eff">Effective October 2026 · version 2.0</p>
<div id="body"><noscript><h2>Information we collect</h2><p>EasySpot collects only what it needs to save and find your spots: your location while the app is open, and the details you type (level, zone, spot, name, note, paid time).</p><h2>Location</h2><p>Approximate and precise location are used only while the app is in use. EasySpot never reads your location in the background.</p><h2>Camera and photos</h2><p>If you photograph your spot, the photo is kept only in EasySpot&#x27;s own files on this phone — not in your gallery — and is deleted when you delete the parking. The level, zone, spot and your car&#x27;s plate are read from it on the phone; the photo is never uploaded. On Android the text is read by Google ML Kit, which runs on the phone and may send Google anonymous usage statistics (never the photo or its text). On iPhone, Apple&#x27;s on-device text recognition is used.</p><h2>Air pressure</h2><p>When you park, EasySpot saves the air pressure from the phone&#x27;s barometer (if it has one), so that later it can show how many floors you are from your car. It is measured only while the app is open — never in the background — stays on this phone and is never uploaded. You can turn it off in Settings → “Floors to your car”.</p><h2>Where your data is stored</h2><p>On this phone only, until you delete it or uninstall the app. There is no account and no EasySpot server.</p><h2>Services on your phone</h2><p>To turn coordinates into a street name, the app asks your phone&#x27;s own geocoding service (Google, Huawei or Apple). On phones with Google Play services, location is measured by Google&#x27;s location service. These services work under their own privacy policies.</p><h2>Reminders</h2><p>If you set paid time, EasySpot schedules a reminder on your phone. Nothing is sent over the internet.</p><h2>Sharing</h2><p>We do not share, sell or rent your data. You can share a spot yourself with the Share button.</p><h2>Your choices</h2><p>You can delete any spot at any time, clear the app&#x27;s data in your phone settings or uninstall the app. You can allow or deny location access at any time in your phone settings.</p><h2>Changes</h2><p>If this policy changes, the app will show the new version and ask you to agree again.</p><h2>Contact</h2><p>Questions about privacy: ilko.z.adamov@gmail.com</p></noscript></div>
<footer>© 2026 EasySpot — Ilko Adamov</footer>
</main>

const DATA = {"en": {"title": "Privacy policy", "effective": "Effective October 2026 · version 2.0", "sections": [["Information we collect", "EasySpot collects only what it needs to save and find your spots: your location while the app is open, and the details you type (level, zone, spot, name, note, paid time)."], ["Location", "Approximate and precise location are used only while the app is in use. EasySpot never reads your location in the background."], ["Camera and photos", "If you photograph your spot, the photo is kept only in EasySpot's own files on this phone — not in your gallery — and is deleted when you delete the parking. The level, zone, spot and your car's plate are read from it on the phone; the photo is never uploaded. On Android the text is read by Google ML Kit, which runs on the phone and may send Google anonymous usage statistics (never the photo or its text). On iPhone, Apple's on-device text recognition is used."], ["Air pressure", "When you park, EasySpot saves the air pressure from the phone's barometer (if it has one), so that later it can show how many floors you are from your car. It is measured only while the app is open — never in the background — stays on this phone and is never uploaded. You can turn it off in Settings → “Floors to your car”."], ["Where your data is stored", "On this phone only, until you delete it or uninstall the app. There is no account and no EasySpot server."], ["Services on your phone", "To turn coordinates into a street name, the app asks your phone's own geocoding service (Google, Huawei or Apple). On phones with Google Play services, location is measured by Google's location service. These services work under their own privacy policies."], ["Reminders", "If you set paid time, EasySpot schedules a reminder on your phone. Nothing is sent over the internet."], ["Sharing", "We do not share, sell or rent your data. You can share a spot yourself with the Share button."], ["Your choices", "You can delete any spot at any time, clear the app's data in your phone settings or uninstall the app. You can allow or deny location access at any time in your phone settings."], ["Changes", "If this policy changes, the app will show the new version and ask you to agree again."], ["Contact", "Questions about privacy: ilko.z.adamov@gmail.com"]]}, "bg": {"title": "Политика за поверителност", "effective": "В сила от октомври 2026 · версия 2.0", "sections": [["Каква информация събираме", "EasySpot събира само необходимото, за да запазиш и намериш местата си: местоположението ти, докато приложението е отворено, и данните, които въвеждаш (етаж, зона, място, име, бележка, платено време)."], ["Местоположение", "Приблизителното и точното местоположение се ползват само докато приложението е в употреба. EasySpot никога не чете местоположението ти във фонов режим."], ["Камера и снимки", "Ако снимаш мястото, снимката се пази само във файловете на EasySpot на този телефон — не в галерията — и се изтрива, когато изтриеш паркинга. Нивото, зоната, мястото и номерът на колата се разчитат от нея на самия телефон; снимката никога не се качва никъде. На Android текстът се разчита от Google ML Kit, който работи на телефона и може да изпраща на Google анонимна статистика за ползването (никога снимката или текста ѝ). На iPhone се използва вграденото разпознаване на текст на Apple."], ["Въздушно налягане", "Когато паркираш, EasySpot записва въздушното налягане от барометъра на телефона (ако има такъв), за да ти покаже после на колко етажа си от колата. Мери се само докато приложението е отворено — никога на заден план, — остава на този телефон и никога не се качва никъде. Можеш да го изключиш от Настройки → „Етажи до колата“."], ["Къде се пазят данните", "Само на този телефон, докато не ги изтриеш или не деинсталираш приложението. Няма акаунт и няма сървър на EasySpot."], ["Услуги на телефона", "За да превърне координатите в име на улица, приложението пита услугата за адреси на телефона (Google, Huawei или Apple). На телефони с Google Play услуги местоположението се измерва от услугата на Google. Тези услуги работят по собствени политики за поверителност."], ["Напомняния", "Ако зададеш платено време, EasySpot насрочва напомняне на телефона. Нищо не се изпраща по интернет."], ["Споделяне", "Не споделяме, не продаваме и не отдаваме данните ти. Можеш сам да споделиш място с бутона „Сподели“."], ["Твоят избор", "Можеш по всяко време да изтриеш всяко място, да изчистиш данните на приложението от настройките на телефона или да го деинсталираш. Можеш по всяко време да разрешиш или откажеш достъпа до местоположение от настройките на телефона."], ["Промени", "Ако политиката се промени, приложението ще покаже новата версия и ще поиска отново съгласието ти."], ["Контакт", "Въпроси за поверителността: ilko.z.adamov@gmail.com"]]}, "ru": {"title": "Политика конфиденциальности", "effective": "Действует с октября 2026 · версия 2.0", "sections": [["Какие данные мы собираем", "EasySpot собирает только то, что нужно, чтобы сохранять и находить места: местоположение, пока приложение открыто, и данные, которые вы вводите (этаж, зона, место, название, заметка, оплаченное время)."], ["Местоположение", "Приблизительное и точное местоположение используется только во время работы приложения. EasySpot никогда не определяет местоположение в фоновом режиме."], ["Камера и фото", "Если вы фотографируете место, фото хранится только в файлах EasySpot на этом телефоне — не в галерее — и удаляется вместе с парковкой. Уровень, зона, место и номер машины распознаются на самом телефоне; фото никуда не загружается. На Android текст распознаёт Google ML Kit, который работает на телефоне и может отправлять Google анонимную статистику использования (но не фото и не его текст). На iPhone используется встроенное распознавание текста Apple."], ["Атмосферное давление", "Когда вы паркуетесь, EasySpot сохраняет атмосферное давление с барометра телефона (если он есть), чтобы потом показать, на сколько этажей вы от машины. Оно измеряется только при открытом приложении — никогда в фоне, — остаётся на этом телефоне и никуда не отправляется. Это можно выключить в Настройках → «Этажи до машины»."], ["Где хранятся данные", "Только на этом телефоне, пока вы их не удалите или не удалите приложение. Нет аккаунта и нет сервера EasySpot."], ["Службы телефона", "Чтобы превратить координаты в название улицы, приложение обращается к службе адресов телефона (Google, Huawei или Apple). На телефонах с сервисами Google Play местоположение определяет служба Google. Эти службы работают по собственным политикам конфиденциальности."], ["Напоминания", "Если вы задали оплаченное время, EasySpot планирует напоминание на телефоне. Ничего не отправляется через интернет."], ["Передача данных", "Мы не передаём, не продаём и не сдаём ваши данные. Вы можете сами поделиться местом кнопкой «Поделиться»."], ["Ваш выбор", "Вы можете в любой момент удалить любое место, очистить данные приложения в настройках телефона или удалить приложение. Доступ к местоположению можно разрешить или запретить в любой момент в настройках телефона."], ["Изменения", "Если политика изменится, приложение покажет новую версию и снова попросит ваше согласие."], ["Контакты", "Вопросы о конфиденциальности: ilko.z.adamov@gmail.com"]]}, "de": {"title": "Datenschutzerklärung", "effective": "Gültig ab Oktober 2026 · Version 2.0", "sections": [["Welche Daten wir erheben", "EasySpot erhebt nur, was nötig ist, um deine Orte zu speichern und zu finden: deinen Standort, solange die App geöffnet ist, und deine Eingaben (Ebene, Zone, Platz, Name, Notiz, bezahlte Zeit)."], ["Standort", "Ungefährer und genauer Standort werden nur verwendet, während die App genutzt wird. EasySpot liest deinen Standort nie im Hintergrund."], ["Kamera und Fotos", "Wenn du deinen Platz fotografierst, wird das Foto nur in EasySpots eigenen Dateien auf diesem Handy gespeichert — nicht in deiner Galerie — und mit dem Parkplatz gelöscht. Ebene, Zone, Platz und dein Kennzeichen werden auf dem Handy daraus gelesen; das Foto wird nie hochgeladen. Auf Android liest Google ML Kit den Text — es läuft auf dem Handy und kann anonyme Nutzungsstatistiken an Google senden (nie das Foto oder seinen Text). Auf dem iPhone wird Apples Texterkennung auf dem Gerät verwendet."], ["Luftdruck", "Wenn du parkst, speichert EasySpot den Luftdruck vom Barometer des Handys (falls vorhanden), um dir später zu zeigen, wie viele Etagen du vom Auto entfernt bist. Er wird nur bei geöffneter App gemessen — nie im Hintergrund —, bleibt auf diesem Handy und wird nie hochgeladen. Du kannst das in den Einstellungen → „Etagen zum Auto“ ausschalten."], ["Wo deine Daten gespeichert sind", "Nur auf diesem Handy, bis du sie löschst oder die App deinstallierst. Es gibt kein Konto und keinen EasySpot-Server."], ["Dienste auf deinem Handy", "Um Koordinaten in einen Straßennamen umzuwandeln, fragt die App den Adressdienst deines Handys (Google, Huawei oder Apple). Auf Handys mit Google Play-Diensten misst der Standortdienst von Google den Standort. Diese Dienste haben eigene Datenschutzerklärungen."], ["Erinnerungen", "Wenn du eine bezahlte Zeit festlegst, plant EasySpot eine Erinnerung auf deinem Handy. Nichts wird über das Internet gesendet."], ["Weitergabe", "Wir geben deine Daten nicht weiter, verkaufen und vermieten sie nicht. Du kannst einen Ort selbst mit „Teilen“ weitergeben."], ["Deine Wahl", "Du kannst jederzeit jeden Ort löschen, die App-Daten in den Handy-Einstellungen löschen oder die App deinstallieren. Den Standortzugriff kannst du jederzeit in den Handy-Einstellungen erlauben oder verweigern."], ["Änderungen", "Ändert sich diese Erklärung, zeigt die App die neue Version und bittet erneut um deine Zustimmung."], ["Kontakt", "Fragen zum Datenschutz: ilko.z.adamov@gmail.com"]]}, "fr": {"title": "Politique de confidentialité", "effective": "En vigueur depuis octobre 2026 · version 2.0", "sections": [["Informations collectées", "EasySpot collecte uniquement ce qui est nécessaire pour enregistrer et retrouver vos lieux : votre position pendant que l'app est ouverte et les détails saisis (niveau, zone, place, nom, note, temps payé)."], ["Position", "La position approximative et précise n'est utilisée que pendant l'utilisation de l'app. EasySpot ne lit jamais votre position en arrière-plan."], ["Caméra et photos", "Si vous photographiez votre place, la photo est conservée uniquement dans les fichiers d'EasySpot sur ce téléphone — pas dans votre galerie — et supprimée avec le stationnement. Le niveau, la zone, la place et la plaque de votre voiture y sont lus sur le téléphone ; la photo n'est jamais envoyée. Sur Android, le texte est lu par Google ML Kit, qui fonctionne sur le téléphone et peut envoyer à Google des statistiques d'utilisation anonymes (jamais la photo ni son texte). Sur iPhone, la reconnaissance de texte d'Apple sur l'appareil est utilisée."], ["Pression de l'air", "Quand vous vous garez, EasySpot enregistre la pression de l'air mesurée par le baromètre du téléphone (s'il en a un), pour vous indiquer ensuite à combien d'étages vous êtes de votre voiture. Elle n'est mesurée que lorsque l'app est ouverte — jamais en arrière-plan —, reste sur ce téléphone et n'est jamais envoyée. Vous pouvez la désactiver dans Réglages → « Étages jusqu'à la voiture »."], ["Où sont stockées vos données", "Uniquement sur ce téléphone, jusqu'à ce que vous les supprimiez ou désinstalliez l'app. Pas de compte, pas de serveur EasySpot."], ["Services du téléphone", "Pour transformer des coordonnées en nom de rue, l'app interroge le service d'adresses du téléphone (Google, Huawei ou Apple). Sur les téléphones avec les services Google Play, la position est mesurée par le service de localisation de Google. Ces services ont leurs propres politiques de confidentialité."], ["Rappels", "Si vous indiquez un temps payé, EasySpot programme un rappel sur votre téléphone. Rien n'est envoyé sur Internet."], ["Partage", "Nous ne partageons, ne vendons et ne louons pas vos données. Vous pouvez partager un lieu vous-même avec le bouton Partager."], ["Vos choix", "Vous pouvez à tout moment supprimer un lieu, effacer les données de l'app dans les réglages du téléphone ou désinstaller l'app. Vous pouvez autoriser ou refuser l'accès à la position à tout moment dans les réglages."], ["Modifications", "Si cette politique change, l'app affichera la nouvelle version et vous demandera à nouveau votre accord."], ["Contact", "Questions sur la confidentialité : ilko.z.adamov@gmail.com"]]}, "es": {"title": "Política de privacidad", "effective": "Vigente desde octubre de 2026 · versión 2.0", "sections": [["Información que recopilamos", "EasySpot recopila solo lo necesario para guardar y encontrar tus lugares: tu ubicación mientras la app está abierta y los datos que escribes (planta, zona, plaza, nombre, nota, tiempo pagado)."], ["Ubicación", "La ubicación aproximada y precisa se usa solo mientras usas la app. EasySpot nunca lee tu ubicación en segundo plano."], ["Cámara y fotos", "Si fotografías tu sitio, la foto se guarda solo en los archivos de EasySpot en este teléfono — no en tu galería — y se borra al borrar el aparcamiento. El nivel, la zona, la plaza y la matrícula se leen en el propio teléfono; la foto nunca se sube. En Android el texto lo lee Google ML Kit, que funciona en el teléfono y puede enviar a Google estadísticas de uso anónimas (nunca la foto ni su texto). En iPhone se usa el reconocimiento de texto de Apple en el dispositivo."], ["Presión del aire", "Cuando aparcas, EasySpot guarda la presión del aire del barómetro del teléfono (si lo tiene), para mostrarte después a cuántas plantas estás de tu coche. Solo se mide con la app abierta —nunca en segundo plano—, se queda en este teléfono y nunca se sube. Puedes desactivarlo en Ajustes → «Plantas hasta tu coche»."], ["Dónde se guardan tus datos", "Solo en este teléfono, hasta que los borres o desinstales la app. No hay cuenta ni servidor de EasySpot."], ["Servicios de tu teléfono", "Para convertir coordenadas en el nombre de una calle, la app consulta el servicio de direcciones de tu teléfono (Google, Huawei o Apple). En teléfonos con servicios de Google Play, la ubicación la mide el servicio de ubicación de Google. Estos servicios tienen sus propias políticas de privacidad."], ["Recordatorios", "Si indicas un tiempo pagado, EasySpot programa un recordatorio en tu teléfono. No se envía nada por internet."], ["Compartir", "No compartimos, vendemos ni alquilamos tus datos. Puedes compartir un lugar tú mismo con el botón Compartir."], ["Tus opciones", "Puedes borrar cualquier lugar en cualquier momento, borrar los datos de la app en los ajustes del teléfono o desinstalarla. Puedes permitir o denegar el acceso a la ubicación en cualquier momento en los ajustes."], ["Cambios", "Si esta política cambia, la app mostrará la nueva versión y te pedirá de nuevo tu aceptación."], ["Contacto", "Preguntas sobre privacidad: ilko.z.adamov@gmail.com"]]}, "it": {"title": "Informativa sulla privacy", "effective": "In vigore da ottobre 2026 · versione 2.0", "sections": [["Informazioni raccolte", "EasySpot raccoglie solo ciò che serve per salvare e ritrovare i tuoi luoghi: la posizione mentre l'app è aperta e i dettagli che inserisci (piano, zona, posto, nome, nota, tempo pagato)."], ["Posizione", "La posizione approssimativa e precisa viene usata solo mentre usi l'app. EasySpot non legge mai la tua posizione in background."], ["Fotocamera e foto", "Se fotografi il tuo posto, la foto è conservata solo nei file di EasySpot su questo telefono — non nella galleria — e viene eliminata insieme al parcheggio. Livello, zona, posto e targa vengono letti sul telefono; la foto non viene mai caricata. Su Android il testo è letto da Google ML Kit, che funziona sul telefono e può inviare a Google statistiche d'uso anonime (mai la foto o il suo testo). Su iPhone si usa il riconoscimento del testo di Apple sul dispositivo."], ["Pressione dell'aria", "Quando parcheggi, EasySpot salva la pressione dell'aria dal barometro del telefono (se presente), per mostrarti poi a quanti piani sei dall'auto. Viene misurata solo con l'app aperta — mai in background —, resta su questo telefono e non viene mai caricata. Puoi disattivarla in Impostazioni → «Piani fino all'auto»."], ["Dove sono salvati i dati", "Solo su questo telefono, finché non li elimini o disinstalli l'app. Nessun account e nessun server EasySpot."], ["Servizi del telefono", "Per trasformare le coordinate nel nome di una via, l'app interroga il servizio indirizzi del telefono (Google, Huawei o Apple). Sui telefoni con i servizi Google Play, la posizione viene misurata dal servizio di localizzazione di Google. Questi servizi hanno le proprie informative sulla privacy."], ["Promemoria", "Se imposti un tempo pagato, EasySpot programma un promemoria sul telefono. Nulla viene inviato via internet."], ["Condivisione", "Non condividiamo, vendiamo né affittiamo i tuoi dati. Puoi condividere un luogo tu stesso con il pulsante Condividi."], ["Le tue scelte", "Puoi eliminare qualsiasi luogo in qualsiasi momento, cancellare i dati dell'app dalle impostazioni del telefono o disinstallarla. Puoi consentire o negare l'accesso alla posizione in qualsiasi momento dalle impostazioni."], ["Modifiche", "Se l'informativa cambia, l'app mostrerà la nuova versione e chiederà di nuovo il tuo consenso."], ["Contatti", "Domande sulla privacy: ilko.z.adamov@gmail.com"]]}, "ro": {"title": "Politica de confidențialitate", "effective": "În vigoare din octombrie 2026 · versiunea 2.0", "sections": [["Ce informații colectăm", "EasySpot colectează doar ce este necesar pentru a salva și găsi locurile tale: locația cât timp aplicația este deschisă și detaliile introduse (nivel, zonă, loc, nume, notă, timp plătit)."], ["Locație", "Locația aproximativă și precisă este folosită doar cât timp folosești aplicația. EasySpot nu citește niciodată locația în fundal."], ["Camera și poze", "Dacă fotografiezi locul, poza este păstrată doar în fișierele EasySpot de pe acest telefon — nu în galerie — și se șterge odată cu parcarea. Nivelul, zona, locul și numărul mașinii sunt citite pe telefon; poza nu este încărcată nicăieri. Pe Android textul este citit de Google ML Kit, care rulează pe telefon și poate trimite către Google statistici anonime de utilizare (niciodată poza sau textul ei). Pe iPhone se folosește recunoașterea de text Apple de pe dispozitiv."], ["Presiunea aerului", "Când parchezi, EasySpot salvează presiunea aerului de la barometrul telefonului (dacă are unul), ca să-ți arate apoi la câte etaje ești de mașină. Este măsurată doar cât aplicația e deschisă — niciodată în fundal —, rămâne pe acest telefon și nu este trimisă nicăieri. O poți opri din Setări → „Etaje până la mașină”."], ["Unde sunt stocate datele", "Doar pe acest telefon, până le ștergi sau dezinstalezi aplicația. Nu există cont și nici server EasySpot."], ["Servicii de pe telefon", "Pentru a transforma coordonatele într-un nume de stradă, aplicația întreabă serviciul de adrese al telefonului (Google, Huawei sau Apple). Pe telefoanele cu servicii Google Play, locația este măsurată de serviciul de localizare Google. Aceste servicii au propriile politici de confidențialitate."], ["Mementouri", "Dacă setezi timp plătit, EasySpot programează un memento pe telefon. Nimic nu este trimis prin internet."], ["Partajare", "Nu partajăm, nu vindem și nu închiriem datele tale. Poți partaja singur un loc cu butonul Partajează."], ["Opțiunile tale", "Poți șterge oricând orice loc, poți șterge datele aplicației din setările telefonului sau poți dezinstala aplicația. Poți permite sau refuza oricând accesul la locație din setările telefonului."], ["Modificări", "Dacă politica se schimbă, aplicația va afișa noua versiune și îți va cere din nou acordul."], ["Contact", "Întrebări despre confidențialitate: ilko.z.adamov@gmail.com"]]}, "tr": {"title": "Gizlilik politikası", "effective": "Ekim 2026'dan itibaren geçerli · sürüm 2.0", "sections": [["Topladığımız bilgiler", "EasySpot yalnızca yerlerini kaydetmek ve bulmak için gerekeni toplar: uygulama açıkken konumun ve girdiğin bilgiler (kat, bölge, yer, ad, not, ücretli süre)."], ["Konum", "Yaklaşık ve kesin konum yalnızca uygulama kullanılırken kullanılır. EasySpot konumunu asla arka planda okumaz."], ["Kamera ve fotoğraflar", "Yerini fotoğraflarsan fotoğraf yalnızca bu telefondaki EasySpot dosyalarında saklanır — galerinde değil — ve park kaydını sildiğinde silinir. Kat, bölge, yer ve aracının plakası telefonda okunur; fotoğraf hiçbir yere yüklenmez. Android'de metni telefonda çalışan Google ML Kit okur ve Google'a anonim kullanım istatistikleri gönderebilir (fotoğrafı ya da metnini asla). iPhone'da Apple'ın cihaz üzerindeki metin tanıma özelliği kullanılır."], ["Hava basıncı", "Park ettiğinde EasySpot, telefonun barometresinden (varsa) hava basıncını kaydeder; böylece daha sonra arabandan kaç kat uzakta olduğunu gösterebilir. Yalnızca uygulama açıkken ölçülür — asla arka planda —, bu telefonda kalır ve hiçbir yere yüklenmez. Ayarlar → “Arabaya kadar katlar” bölümünden kapatabilirsin."], ["Verilerin nerede saklanır", "Yalnızca bu telefonda, sen silene veya uygulamayı kaldırana kadar. Hesap yok, EasySpot sunucusu yok."], ["Telefonundaki hizmetler", "Koordinatları sokak adına çevirmek için uygulama telefonunun adres hizmetine (Google, Huawei veya Apple) sorar. Google Play hizmetleri olan telefonlarda konumu Google'ın konum hizmeti ölçer. Bu hizmetler kendi gizlilik politikalarına tabidir."], ["Hatırlatıcılar", "Ücretli süre ayarlarsan EasySpot telefonunda bir hatırlatıcı planlar. İnternet üzerinden hiçbir şey gönderilmez."], ["Paylaşım", "Verilerini paylaşmayız, satmayız veya kiralamayız. Bir yeri Paylaş düğmesiyle kendin paylaşabilirsin."], ["Seçimlerin", "İstediğin zaman herhangi bir yeri silebilir, telefon ayarlarından uygulama verilerini temizleyebilir veya uygulamayı kaldırabilirsin. Konum erişimine telefon ayarlarından istediğin zaman izin verebilir veya reddedebilirsin."], ["Değişiklikler", "Bu politika değişirse uygulama yeni sürümü gösterir ve onayını yeniden ister."], ["İletişim", "Gizlilikle ilgili sorular: ilko.z.adamov@gmail.com"]]}};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify = (s) => esc(s).replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
function show(code) {
  const d = DATA[code] || DATA.en;
  document.documentElement.lang = code;
  document.getElementById("title").textContent = d.title;
  document.getElementById("eff").textContent = d.effective;
  document.getElementById("body").innerHTML = d.sections.map(([h, t]) => `<section><h2>${esc(h)}</h2><p>${linkify(t)}</p></section>`).join("");
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  try { history.replaceState(null, "", "#" + code); } catch (e) {}
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.lang)));
const fromHash = location.hash.slice(1);
const fromBrowser = (navigator.languages || [navigator.language || "en"]).map((l) => l.slice(0, 2)).find((l) => DATA[l]);
show(DATA[fromHash] ? fromHash : fromBrowser || "en");
</script>
